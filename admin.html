<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Lost & Found Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body class="dashboard-page">

    <nav class="dash-navbar">
        <div class="dash-logo"><i class="fas fa-user-shield"></i> Admin Panel</div>
        <div class="dash-nav-actions">
            <span id="welcomeText"></span>
            <a href="dashboard.html" class="btn-sm-action btn-action"><i class="fas fa-th-large"></i> Dashboard</a>
            <button class="btn-ghost-dark" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <h3 class="admin-section-title">Pending Reports</h3>
    <div class="items-grid" id="pendingGrid">
        <p class="loading-text">Loading...</p>
    </div>

    <h3 class="admin-section-title">All Items</h3>
    <div class="table-wrapper">
        <table class="admin-table" id="allItemsTable">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Location</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="allItemsBody">
                <tr><td colspan="5">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="supabase.js"></script>
    <script src="admin.js"></script>
</body>

</html>
