<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saylani Campus Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container" id="main-container">

        <div class="form-container sign-up-box">
            <form>
                <h2 class="fw-bold mb-3">Create Account</h2>
                <div class="input-group-custom">
                    <i class="fas fa-user"></i>
                    <input type="text" id="signupName" placeholder="Full Name" required>
                </div>
                <div class="input-group-custom">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="signupEmail" placeholder="Email Address" required>
                </div>
                <div class="input-group-custom">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="signupPass" placeholder="Password" required>
                </div>
                <div class="input-group-custom">
                    <i class="fas fa-check-double"></i>
                    <input type="password" id="signupConfirm" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="btn-action mt-3">Register Now</button>
                <p class="mobile-toggle"
                    onclick="document.querySelector('.main-container').classList.remove('active-signup')">
                    Already have an account? Sign In
                </p>
            </form>
        </div>

        <div class="form-container login-box">
            <form>
                <h2 class="fw-bold mb-3">Welcome Back</h2>
                <p class="text-muted mb-4">Please enter your details to login</p>
                <div class="input-group-custom">
                    <i class="fas fa-envelope"></i>
                    <input type="email"  id="loginEmail" placeholder="Email Address" required>
                </div>
                <div class="input-group-custom">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPass" placeholder="Password" required>
                </div>
                <a href="#" class="forgot-link">Forgot Password?</a>
                <button type="submit" class="btn-action mt-2">Login</button>
            </form>
        </div>

        <div class="overlay-wrapper">
            <div class="overlay-panel-main">
                <div class="side-panel side-left">
                    <i class="fas fa-shield-alt fa-4x mb-4"></i>
                    <h1>Already a Member?</h1>
                    <p>To keep connected with our community, please log in with your account.</p>
                    <button class="btn-ghost" id="loginBtn">Sign In</button>
                </div>
                <div class="side-panel side-right">
                    <img src="assets/logo.png" width="250px"  alt="logo">
                    <h1>Lost And  <br> Found  Portal
                    </h1>
                    <p>Register yourself to get continue.</p>
                    <button class="btn-ghost" id="signupBtn">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="supabase.js"></script>
    <script src="app.js"></script>
</body>

</html>
